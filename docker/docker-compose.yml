services:
  postgres:
    image: postgres:16-alpine
    container_name: payflow-postgres
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow_secret
      POSTGRES_MULTIPLE_DATABASES: ledger_service,wallet_service,payment_service,funding_service,notification_service,statement_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: payflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: payflow-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: payflow-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@payflow.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  ledger-service:
    build:
      context: ..
      dockerfile: src/Services/LedgerService/Dockerfile
    container_name: payflow-ledger
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__LedgerDb: "Host=postgres;Database=ledger_service;Username=payflow;Password=payflow_secret"
      ConnectionStrings__RabbitMq: "rabbitmq"
      Otlp__Endpoint: "http://jaeger:4317"
      ASPNETCORE_ENVIRONMENT: "Development"

  wallet-service:
    build:
      context: ..
      dockerfile: src/Services/WalletService/Dockerfile
    container_name: payflow-wallet
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      funding-service:
        condition: service_started
    environment:
      ConnectionStrings__WalletDb: "Host=postgres;Database=wallet_service;Username=payflow;Password=payflow_secret"
      ConnectionStrings__RabbitMq: "rabbitmq"
      FundingService__BaseUrl: "http://funding-service:8080"
      Otlp__Endpoint: "http://jaeger:4317"
      ASPNETCORE_ENVIRONMENT: "Development"

  payment-service:
    build:
      context: ..
      dockerfile: src/Services/PaymentService/Dockerfile
    container_name: payflow-payment
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__PaymentDb: "Host=postgres;Database=payment_service;Username=payflow;Password=payflow_secret"
      ConnectionStrings__RabbitMq: "rabbitmq"
      Otlp__Endpoint: "http://jaeger:4317"
      ASPNETCORE_ENVIRONMENT: "Development"

  funding-service:
    build:
      context: ..
      dockerfile: src/Services/FundingService/Dockerfile
    container_name: payflow-funding
    ports:
      - "5004:8080"
    environment:
      Otlp__Endpoint: "http://jaeger:4317"
      ASPNETCORE_ENVIRONMENT: "Development"
      FundingFailureRate: "0.3"

  notification-service:
    build:
      context: ..
      dockerfile: src/Services/NotificationService/Dockerfile
    container_name: payflow-notification
    ports:
      - "5005:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__RabbitMq: "rabbitmq"
      Otlp__Endpoint: "http://jaeger:4317"
      ASPNETCORE_ENVIRONMENT: "Development"

  statement-service:
    build:
      context: ..
      dockerfile: src/Services/StatementService/Dockerfile
    container_name: payflow-statement
    ports:
      - "5006:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__StatementDb: "Host=postgres;Database=statement_service;Username=payflow;Password=payflow_secret"
      ConnectionStrings__RabbitMq: "rabbitmq"
      Otlp__Endpoint: "http://jaeger:4317"
      ASPNETCORE_ENVIRONMENT: "Development"

  api-gateway:
    build:
      context: ..
      dockerfile: src/Services/ApiGateway/Dockerfile
    container_name: payflow-gateway
    ports:
      - "5600:8080"
    depends_on:
      - ledger-service
      - wallet-service
      - payment-service
      - funding-service
      - notification-service
      - statement-service
    environment:
      Otlp__Endpoint: "http://jaeger:4317"
      ASPNETCORE_ENVIRONMENT: "Development"
      ApiKey: "payflow-demo-key"
      ReverseProxy__Clusters__ledger-cluster__Destinations__destination1__Address: "http://ledger-service:8080/"
      ReverseProxy__Clusters__wallet-cluster__Destinations__destination1__Address: "http://wallet-service:8080/"
      ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address: "http://payment-service:8080/"
      ReverseProxy__Clusters__funding-cluster__Destinations__destination1__Address: "http://funding-service:8080/"
      ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address: "http://notification-service:8080/"
      ReverseProxy__Clusters__statement-cluster__Destinations__destination1__Address: "http://statement-service:8080/"

volumes:
  postgres_data:
